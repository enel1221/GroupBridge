server:
  address: ":8080"
  shutdownTimeout: 10s
webhook:
  secretEnv: GROUPBRIDGE_WEBHOOK_SECRET
  maxSkew: 5m
source:
  type: keycloak
  baseURL: https://keycloak.example.com
  realm: engineering
  clientID: groupbridge
  clientSecretFile: /var/run/secrets/groupbridge/keycloak-client-secret
  pollInterval: 30s
targets:
  - name: gitlab-main
    type: gitlab
    baseURL: https://gitlab.example.com
    tokenFile: /var/run/secrets/groupbridge/gitlab-token
    resolverTokenFile: /var/run/secrets/groupbridge/gitlab-resolver-token
    oidcProvider: openid_connect
  - name: vault-main
    type: vault
    baseURL: https://vault.example.com
    oidcMount: oidc
    kvMount: orgs
    kubernetesAuth:
      mount: kubernetes
      role: groupbridge
      tokenFile: /var/run/secrets/tokens/vault
rules:
  - name: engineering-groups
    sourceGroupPrefix: /Internal
    sourceGroupPaths:
      - /Internal/CCMO
      - /Internal/CCMO/J6
    targetProvider: gitlab-main
    targetParent: platform
    createGroups: false
    adoptExistingGroup: false
    accessLevel: developer
    prune: managed-only
    protectedUsers:
      - root
      - breakglass-admin
    maxRemovals: 10
    identityMatch:
      # Use only oidc-username instead when GitLab's OIDC uid_field is
      # preferred_username. It never falls back to a local same-name account.
      - oidc
    enforceAccessLevel: false
  - name: engineering-vault
    sourceGroupPrefix: /Internal
    sourceGroupPaths:
      - /Internal/CCMO
      - /Internal/CCMO/J6
    targetProvider: vault-main
    prune: none
    vault:
      pathPrefix: internal
      accessProfile: editor
      policyMode: verify-only
      # Opt-in: LIST on metadata ancestors exposes sibling key names.
      discoverable: false
state:
  path: /var/lib/groupbridge/state.json
